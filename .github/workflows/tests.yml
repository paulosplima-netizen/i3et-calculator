# Every push and every pull request runs the same suite the author runs.
# Documento 4, secao 6: the acceptance of the calculator is a command, not a
# memory of having checked.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes
        run: python -m pytest -q

      - name: Validacao contra o i3ET
        run: python tools/validate_core.py

      - name: Estilo
        run: ruff check core tools tests
